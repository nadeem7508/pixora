<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixora – Share Your World</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink: #E1306C;
    --purple: #833AB4;
    --orange: #F77737;
    --yellow: #FCAF45;
    --grad: linear-gradient(135deg, #833AB4 0%, #E1306C 50%, #F77737 100%);
    --dark: #0a0a0a;
    --card: #111111;
    --border: #2a2a2a;
    --text: #f5f5f5;
    --muted: #888;
  }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Animated gradient background blobs */
  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    animation: float 8s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  .blob1 { width: 500px; height: 500px; background: #833AB4; top: -100px; left: -100px; animation-delay: 0s; }
  .blob2 { width: 400px; height: 400px; background: #E1306C; bottom: -100px; right: -50px; animation-delay: 3s; }
  .blob3 { width: 300px; height: 300px; background: #F77737; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: 1.5s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20px, -20px) scale(1.05); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 20px;
  }

  .logo {
    text-align: center;
    margin-bottom: 10px;
  }
  .logo h1 {
    font-family: 'Pacifico', cursive;
    font-size: 48px;
    background: var(--grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
  }
  .logo p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 4px;
  }

  /* Fake phone mockup */
  .mockup-strip {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 24px 0;
  }
  .mockup-img {
    width: 90px;
    height: 140px;
    border-radius: 12px;
    object-fit: cover;
    border: 2px solid var(--border);
    overflow: hidden;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }
  .mockup-img:nth-child(2) { transform: translateY(-12px); }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    backdrop-filter: blur(20px);
  }

  .card h2 {
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 24px;
    color: #fff;
  }

  .tabs {
    display: flex;
    background: #1a1a1a;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 24px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    transition: all 0.2s;
    border: none;
    background: transparent;
  }
  .tab.active {
    background: var(--grad);
    color: #fff;
    font-weight: 600;
  }

  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .form-group input, .form-group select {
    width: 100%;
    padding: 12px 16px;
    background: #1a1a1a;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
    outline: none;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--pink);
  }
  .form-group select option { background: #1a1a1a; }

  .role-pills {
    display: flex;
    gap: 10px;
  }
  .role-pill {
    flex: 1;
    padding: 14px 10px;
    border: 2px solid var(--border);
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #1a1a1a;
  }
  .role-pill:hover { border-color: var(--pink); }
  .role-pill.selected {
    border-color: var(--pink);
    background: rgba(225,48,108,0.1);
  }
  .role-pill .pill-icon { font-size: 28px; margin-bottom: 6px; }
  .role-pill .pill-label { font-size: 13px; font-weight: 600; color: #fff; }
  .role-pill .pill-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--grad);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 8px;
  }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .divider {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin: 16px 0;
    position: relative;
  }
  .divider::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0; right: 0;
    height: 1px;
    background: var(--border);
  }
  .divider span { background: var(--card); padding: 0 12px; position: relative; }

  .switch-link {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 16px;
  }
  .switch-link a { color: var(--pink); text-decoration: none; font-weight: 600; cursor: pointer; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #222;
    border: 1px solid var(--border);
    color: #fff;
    padding: 12px 24px;
    border-radius: 40px;
    font-size: 14px;
    z-index: 9999;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--pink); color: var(--pink); }
  .toast.success { border-color: #22c55e; color: #22c55e; }

  #loginForm, #signupForm { display: none; }
  #loginForm.active, #signupForm.active { display: block; }
</style>
</head>
<body>

<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="bg-blob blob3"></div>

<div class="container">
  <div class="logo">
    <h1>Pixora</h1>
    <p>Capture. Share. Inspire.</p>
  </div>

  <div class="mockup-strip">
    <div class="mockup-img">📸</div>
    <div class="mockup-img">🌄</div>
    <div class="mockup-img">🎨</div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Log In</button>
      <button class="tab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm" class="active">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn-primary" id="loginBtn" onclick="handleLogin()">Log In</button>
      <div class="switch-link">Don't have an account? <a onclick="switchTab('signup')">Sign up</a></div>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="signupUsername" placeholder="@yourusername" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Min. 6 characters" />
      </div>
      <div class="form-group">
        <label>I am a...</label>
        <div class="role-pills">
          <div class="role-pill" id="pill-consumer" onclick="selectRole('consumer')">
            <div class="pill-icon">👤</div>
            <div class="pill-label">Consumer</div>
            <div class="pill-desc">Browse & interact</div>
          </div>
          <div class="role-pill" id="pill-creator" onclick="selectRole('creator')">
            <div class="pill-icon">📷</div>
            <div class="pill-label">Creator</div>
            <div class="pill-desc">Upload & share</div>
          </div>
        </div>
      </div>
      <button class="btn-primary" id="signupBtn" onclick="handleSignup()">Create Account</button>
      <div class="switch-link">Already have an account? <a onclick="switchTab('login')">Log in</a></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// =====================
// CONFIG — swap these
// =====================
const SUPABASE_URL = 'https://uapvxuvmacwobeiabyjv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhcHZ4dXZtYWN3b2JlaWFieWp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTE2MjcsImV4cCI6MjA5MzY2NzYyN30.FwbvzdHM-YE5aQzZDoejmwuqh4lXEgH6ISnXD2Bbc9U';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let selectedRole = null;

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='signup'&&i===1));
  });
  document.getElementById('loginForm').classList.toggle('active', tab==='login');
  document.getElementById('signupForm').classList.toggle('active', tab==='signup');
}

function selectRole(role) {
  selectedRole = role;
  document.getElementById('pill-consumer').classList.toggle('selected', role==='consumer');
  document.getElementById('pill-creator').classList.toggle('selected', role==='creator');
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function handleLogin() {

  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  if (!email || !password) {
    return showToast('Please fill in all fields', 'error');
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  const { data, error } = await sb.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    showToast(error.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Log In';
    return;
  }

  // 🔥 SAFE PROFILE FETCH (NO CRASH)
  const { data: profile } = await sb
    .from('profiles')
    .select('role')
    .eq('id', data.user.id)
    .maybeSingle();

  console.log("PROFILE:", profile);

  const role = (profile?.role || 'consumer').toLowerCase();

  showToast('Welcome back! 👋', 'success');

  btn.disabled = false;
  btn.textContent = 'Log In';

  setTimeout(() => {

    if (role === 'creator') {
      window.location.href = 'creator.html';
    } else {
      window.location.href = 'consumer.html';
    }

  }, 800);
}
async function handleSignup() {
  const username = document.getElementById('signupUsername').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;

  if (!username || !email || !password) return showToast('Please fill in all fields', 'error');
  if (!selectedRole) return showToast('Please select a role', 'error');
  if (password.length < 2) return showToast('Password must be 2+ characters', 'error');

  const btn = document.getElementById('signupBtn');
  btn.disabled = true; btn.textContent = 'Creating account...';

  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) {
    showToast(error.message, 'error');
    btn.disabled = false; btn.textContent = 'Create Account';
    return;
  }

  // Insert profile
  if (data.user) {
    await sb.from('profiles').insert({
      id: data.user.id,
      username: username,
      role: selectedRole,
      avatar_url: null,
      bio: ''
    });
  }

 showToast('Account created! ✨', 'success');
btn.disabled = false; 
btn.textContent = 'Create Account';

setTimeout(() => {
  window.location.replace(
    selectedRole === 'creator'  
      ? 'creator.html'
      : 'consumer.html'
  );
}, 800);
}

// Check if already logged in
// Check if already logged in
(async () => {
  try {
    const {
      data: { session },
    } = await sb.auth.getSession();

    if (!session || !session.user) return;

    const { data: profile, error } = await sb
      .from('profiles')
      .select('role')
      .eq('id', session.user.id)
      .single();

    if (error || !profile) return;

    // Redirect safely
    if (profile.role === 'creator') {
      window.location.replace('creator.html');
    } else {
      window.location.replace('consumer.html');
    }

  } catch (err) {
    console.error(err);
  }
})();
</script>
</body>
</html>
