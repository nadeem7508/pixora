<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixora – Creator Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pink: #E1306C; --purple: #833AB4; --orange: #F77737;
    --grad: linear-gradient(135deg, #833AB4 0%, #E1306C 50%, #F77737 100%);
    --dark: #0a0a0a; --card: #111; --border: #222; --text: #f5f5f5; --muted: #777;
  }
  body { background: var(--dark); color: var(--text); font-family: 'DM Sans', sans-serif; }

  /* SIDEBAR */
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 240px;
    background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 24px 0; z-index: 100;
  }
  .sidebar-logo {
    font-family: 'Pacifico', cursive; font-size: 28px;
    background: var(--grad); -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; background-clip: text;
    padding: 0 24px; margin-bottom: 32px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 24px; cursor: pointer; transition: background 0.2s;
    font-size: 15px; font-weight: 500; color: var(--muted);
    border: none; background: transparent; width: 100%; text-align: left;
  }
  .nav-item:hover { background: #1a1a1a; color: var(--text); }
  .nav-item.active { color: var(--text); background: #1a1a1a; }
  .nav-item.active::before {
    content: ''; position: absolute; left: 0; width: 3px; height: 44px;
    background: var(--grad); border-radius: 0 2px 2px 0;
  }
  .nav-item { position: relative; }
  .nav-icon { font-size: 20px; }

  .sidebar-user {
    margin-top: auto; padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .user-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--grad); display: flex; align-items: center;
    justify-content: center; font-size: 18px; flex-shrink: 0;
    overflow: hidden;
  }
  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .user-info .user-name { font-size: 13px; font-weight: 600; }
  .user-info .user-role {
    font-size: 11px; color: var(--muted);
    background: rgba(225,48,108,0.15); color: var(--pink);
    padding: 2px 8px; border-radius: 20px; display: inline-block; margin-top: 2px;
  }
  .logout-btn {
    margin-left: auto; background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 18px; padding: 4px;
  }
  .logout-btn:hover { color: var(--pink); }

  /* MAIN */
  .main { margin-left: 240px; min-height: 100vh; }

  /* HEADER */
  .header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 50;
  }
  .header h2 { font-size: 20px; font-weight: 700; }
  .btn-upload {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 20px; background: var(--grad); border: none; border-radius: 10px;
    color: #fff; font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: opacity 0.2s;
  }
  .btn-upload:hover { opacity: 0.9; }

  /* CONTENT */
  .content { padding: 32px; }

  /* STATS ROW */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 24px;
  }
  .stat-card .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .stat-val { font-size: 32px; font-weight: 700; margin-top: 4px; }
  .stat-card .stat-val span { font-size: 14px; color: var(--muted); font-weight: 400; }

  /* UPLOAD MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
    backdrop-filter: blur(8px);
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 24px;
    width: 100%; max-width: 520px; padding: 32px; max-height: 90vh; overflow-y: auto;
    transform: scale(0.95); transition: transform 0.2s;
  }
  .modal-overlay.open .modal { transform: scale(1); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .modal-header h3 { font-size: 18px; font-weight: 700; }
  .modal-close { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; }
  .modal-close:hover { color: var(--text); }

  .drop-zone {
    border: 2px dashed var(--border); border-radius: 16px;
    padding: 40px; text-align: center; margin-bottom: 20px;
    cursor: pointer; transition: all 0.2s; position: relative;
  }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--pink); background: rgba(225,48,108,0.05); }
  .drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop-zone .dz-icon { font-size: 40px; margin-bottom: 8px; }
  .drop-zone .dz-text { font-size: 14px; color: var(--muted); }
  .drop-zone .dz-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #previewImg {
    width: 100%; max-height: 200px; object-fit: cover; border-radius: 12px;
    display: none; margin-bottom: 16px;
  }

  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group input, .form-group textarea {
    width: 100%; padding: 12px 14px; background: #1a1a1a;
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 14px; font-family: inherit;
    outline: none; transition: border-color 0.2s; resize: none;
  }
  .form-group input:focus, .form-group textarea:focus { border-color: var(--pink); }
  .btn-submit {
    width: 100%; padding: 14px; background: var(--grad); border: none;
    border-radius: 12px; color: #fff; font-size: 15px; font-weight: 600;
    font-family: inherit; cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
  }
  .btn-submit:hover { opacity: 0.9; }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  /* POSTS GRID */
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .post-thumb {
    aspect-ratio: 1; position: relative; overflow: hidden;
    background: #1a1a1a; cursor: pointer;
  }
  .post-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
  .post-thumb:hover img { transform: scale(1.05); }
  .post-thumb-overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center; gap: 16px;
    opacity: 0; transition: opacity 0.2s; color: #fff; font-size: 14px; font-weight: 600;
  }
  .post-thumb:hover .post-thumb-overlay { opacity: 1; }
  .overlay-stat { display: flex; align-items: center; gap: 6px; }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--muted);
    grid-column: 1 / -1;
  }
  .empty-state .es-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  /* POST DETAIL MODAL */
  .post-modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 24px;
    width: 100%; max-width: 800px; display: flex; overflow: hidden;
    transform: scale(0.95); transition: transform 0.2s; max-height: 90vh;
  }
  .modal-overlay.open .post-modal { transform: scale(1); }
  .post-modal-img { width: 55%; flex-shrink: 0; background: #000; }
  .post-modal-img img { width: 100%; height: 100%; object-fit: contain; }
  .post-modal-side { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .pms-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .pms-meta { flex: 1; }
  .pms-title { font-weight: 700; font-size: 14px; }
  .pms-caption { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pms-delete { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
  .pms-delete:hover { color: #ef4444; }
  .pms-meta-info { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .pms-meta-info span { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; }
  .pms-comments { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .comment-item { display: flex; gap: 8px; margin-bottom: 12px; }
  .comment-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--grad); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; overflow: hidden; }
  .comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .comment-body .comment-author { font-size: 12px; font-weight: 700; }
  .comment-body .comment-text { font-size: 13px; color: #ddd; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #222; border: 1px solid var(--border); color: #fff; padding: 12px 24px;
    border-radius: 40px; font-size: 14px; z-index: 9999; transition: transform 0.3s ease;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--pink); color: var(--pink); }
  .toast.success { border-color: #22c55e; color: #22c55e; }

  /* Loading */
  .spinner {
    width: 24px; height: 24px; border: 3px solid var(--border);
    border-top-color: var(--pink); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 40px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar">
  <div class="sidebar-logo">Pixora</div>
  <button class="nav-item active" onclick="showSection('posts')">
    <span class="nav-icon">🏠</span> My Posts
  </button>
  <button class="nav-item" onclick="showSection('upload')">
    <span class="nav-icon">➕</span> New Post
  </button>
  <button class="nav-item" onclick="showSection('profile')">
    <span class="nav-icon">👤</span> Profile
  </button>
  <div class="sidebar-user">
    <div class="user-avatar" id="sidebarAvatar">📷</div>
    <div class="user-info">
      <div class="user-name" id="sidebarUsername">Loading...</div>
      <div class="user-role">Creator</div>
    </div>
    <button class="logout-btn" onclick="logout()" title="Logout">⬅</button>
  </div>
</nav>

<!-- MAIN -->
<div class="main">
  <div class="header">
    <h2 id="headerTitle">My Posts</h2>
    <button class="btn-upload" onclick="openUploadModal()">
      <span>+</span> Upload Photo
    </button>
  </div>
  <div class="content" id="mainContent">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Posts</div>
        <div class="stat-val" id="statPosts">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Likes</div>
        <div class="stat-val" id="statLikes">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Comments</div>
        <div class="stat-val" id="statComments">0</div>
      </div>
    </div>
    <div class="section-title">Your Photos</div>
    <div class="posts-grid" id="postsGrid">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<!-- UPLOAD MODAL -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <div class="modal-header">
      <h3>New Post</h3>
      <button class="modal-close" onclick="closeUploadModal()">✕</button>
    </div>
    <img id="previewImg" src="" alt="preview" />
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)" />
      <div class="dz-icon">📷</div>
      <div class="dz-text">Drop your photo here or <strong style="color:var(--pink)">browse</strong></div>
      <div class="dz-sub">PNG, JPG up to 10MB</div>
    </div>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="postTitle" placeholder="Give your post a title" />
    </div>
    <div class="form-group">
      <label>Caption</label>
      <textarea id="postCaption" rows="3" placeholder="Write a caption..."></textarea>
    </div>
    <div class="form-group">
      <label>Location</label>
      <input type="text" id="postLocation" placeholder="e.g. London, UK" />
    </div>
    <div class="form-group">
      <label>People Present</label>
      <input type="text" id="postPeople" placeholder="e.g. @alice, @bob" />
    </div>
    <button class="btn-submit" id="submitBtn" onclick="handleUpload()">Share Photo</button>
  </div>
</div>

<!-- POST DETAIL MODAL -->
<div class="modal-overlay" id="postModal">
  <div class="post-modal">
    <div class="post-modal-img">
      <img id="pmImage" src="" alt="" />
    </div>
    <div class="post-modal-side">
      <div class="pms-header">
        <div class="user-avatar" style="width:36px;height:36px;">📷</div>
        <div class="pms-meta">
          <div class="pms-title" id="pmTitle"></div>
          <div class="pms-caption" id="pmCaption"></div>
        </div>
        <button class="pms-delete" id="pmDelete" onclick="deletePost()">🗑</button>
        <button class="modal-close" onclick="closePostModal()">✕</button>
      </div>
      <div class="pms-meta-info" id="pmMeta"></div>
      <div class="pms-comments" id="pmComments"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://uapvxuvmacwobeiabyjv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhcHZ4dXZtYWN3b2JlaWFieWp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTE2MjcsImV4cCI6MjA5MzY2NzYyN30.FwbvzdHM-YE5aQzZDoejmwuqh4lXEgH6ISnXD2Bbc9U';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let userProfile = null;
let selectedFile = null;
let currentPostId = null;

// AUTH CHECK
// AUTH CHECK
(async () => {
  try {

    const {
      data: { session },
    } = await sb.auth.getSession();

    // Not logged in
    if (!session || !session.user) {
      window.location.replace('index.html');
      return;
    }

    currentUser = session.user;

    // Get profile
    const { data: p, error } = await sb
      .from('profiles')
      .select('*')
      .eq('id', currentUser.id)
      .single();

    // Profile missing
    if (error || !p) {
      await sb.auth.signOut();
      window.location.replace('index.html');
      return;
    }

    // Wrong role
    if (p.role !== 'creator') {
      window.location.replace('consumer.html');
      return;
    }

    userProfile = p;

    document.getElementById('sidebarUsername').textContent =
      '@' + p.username;

    if (p.avatar_url) {
      document.getElementById(
        'sidebarAvatar'
      ).innerHTML = `<img src="${p.avatar_url}" alt="">`;
    }

    // Load page
    await loadPosts();

  } catch (err) {
    console.error('Creator auth error:', err);
  }
})();

async function loadPosts() {
  const grid = document.getElementById('postsGrid');
  grid.innerHTML = '<div class="spinner"></div>';
  const { data: posts, error } = await sb.from('posts')
    .select('*, likes(count), comments(count)')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });

  if (error || !posts) { grid.innerHTML = '<div class="empty-state"><div class="es-icon">😕</div><p>Could not load posts</p></div>'; return; }

  document.getElementById('statPosts').textContent = posts.length;
  const totalLikes = posts.reduce((a,p) => a + (p.likes?.[0]?.count || 0), 0);
  const totalComments = posts.reduce((a,p) => a + (p.comments?.[0]?.count || 0), 0);
  document.getElementById('statLikes').textContent = totalLikes;
  document.getElementById('statComments').textContent = totalComments;

  if (!posts.length) {
    grid.innerHTML = `<div class="empty-state"><div class="es-icon">📷</div><p>No posts yet. Upload your first photo!</p></div>`;
    return;
  }

  grid.innerHTML = posts.map(p => `
    <div class="post-thumb" onclick="openPost('${p.id}')">
      <img src="${p.image_url}" alt="${p.title}" loading="lazy" />
      <div class="post-thumb-overlay">
        <span class="overlay-stat">❤️ ${p.likes?.[0]?.count||0}</span>
        <span class="overlay-stat">💬 ${p.comments?.[0]?.count||0}</span>
      </div>
    </div>
  `).join('');
}

function openUploadModal() {
  document.getElementById('uploadModal').classList.add('open');
}
function closeUploadModal() {
  document.getElementById('uploadModal').classList.remove('open');
  selectedFile = null;
  document.getElementById('previewImg').style.display = 'none';
  document.getElementById('dropZone').style.display = 'block';
  document.getElementById('postTitle').value = '';
  document.getElementById('postCaption').value = '';
  document.getElementById('postLocation').value = '';
  document.getElementById('postPeople').value = '';
}

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  selectedFile = file;
  const url = URL.createObjectURL(file);
  const img = document.getElementById('previewImg');
  img.src = url; img.style.display = 'block';
  document.getElementById('dropZone').style.display = 'none';
}

// Drag-drop
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    selectedFile = file;
    const url = URL.createObjectURL(file);
    const img = document.getElementById('previewImg');
    img.src = url; img.style.display = 'block';
    dz.style.display = 'none';
  }
});

async function handleUpload() {
  if (!selectedFile) return showToast('Please select a photo', 'error');
  const title = document.getElementById('postTitle').value.trim();
  if (!title) return showToast('Please add a title', 'error');

  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Uploading...';

  // Upload image to Supabase Storage
  const ext = selectedFile.name.split('.').pop();
  const fileName = `${currentUser.id}/${Date.now()}.${ext}`;
  const { error: upErr } = await sb.storage.from('posts').upload(fileName, selectedFile);
  if (upErr) { showToast('Upload failed: ' + upErr.message, 'error'); btn.disabled=false; btn.textContent='Share Photo'; return; }

  const { data: urlData } = sb.storage.from('posts').getPublicUrl(fileName);

  // Insert post record
  const { error: insertErr } = await sb.from('posts').insert({
    user_id: currentUser.id,
    title: title,
    caption: document.getElementById('postCaption').value.trim(),
    location: document.getElementById('postLocation').value.trim(),
    people: document.getElementById('postPeople').value.trim(),
    image_url: urlData.publicUrl,
    storage_path: fileName
  });

  if (insertErr) { showToast('Could not save post: ' + insertErr.message, 'error'); btn.disabled=false; btn.textContent='Share Photo'; return; }

  showToast('Photo shared! 🎉', 'success');
  btn.disabled=false; btn.textContent='Share Photo';
  closeUploadModal();
  loadPosts();
}

async function openPost(postId) {
  currentPostId = postId;
  const { data: post } = await sb.from('posts').select('*').eq('id', postId).single();
  if (!post) return;
  document.getElementById('pmImage').src = post.image_url;
  document.getElementById('pmTitle').textContent = post.title;
  document.getElementById('pmCaption').textContent = post.caption || '';
  let meta = '';
  if (post.location) meta += `<span>📍 ${post.location}</span>`;
  if (post.people) meta += `<span>👥 ${post.people}</span>`;
  document.getElementById('pmMeta').innerHTML = meta;

  // Load comments
  const { data: comments } = await sb.from('comments').select('*, profiles(username, avatar_url)').eq('post_id', postId).order('created_at');
  const commBox = document.getElementById('pmComments');
  if (!comments?.length) { commBox.innerHTML = '<p style="color:var(--muted);font-size:13px;text-align:center;padding:20px">No comments yet</p>'; }
  else {
    commBox.innerHTML = comments.map(c => `
      <div class="comment-item">
        <div class="comment-avatar">${c.profiles?.avatar_url ? `<img src="${c.profiles.avatar_url}" />` : '👤'}</div>
        <div class="comment-body">
          <div class="comment-author">@${c.profiles?.username || 'user'}</div>
          <div class="comment-text">${c.text}</div>
        </div>
      </div>
    `).join('');
  }
  document.getElementById('postModal').classList.add('open');
}

function closePostModal() {
  document.getElementById('postModal').classList.remove('open');
  currentPostId = null;
}

async function deletePost() {
  if (!currentPostId) return;
  if (!confirm('Delete this post?')) return;
  const { error } = await sb.from('posts').delete().eq('id', currentPostId).eq('user_id', currentUser.id);
  if (error) return showToast('Could not delete', 'error');
  showToast('Post deleted', 'success');
  closePostModal();
  loadPosts();
}

function showSection(sec) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event.currentTarget.classList.add('active');
  if (sec === 'upload') openUploadModal();
  else if (sec === 'posts') { document.getElementById('headerTitle').textContent = 'My Posts'; }
  else if (sec === 'profile') { document.getElementById('headerTitle').textContent = 'Profile'; }
}

async function logout() {
  await sb.auth.signOut();
  window.location.replace('index.html');
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
